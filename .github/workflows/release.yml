name: Release - Portable EXE (Beta & Stable)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version (e.g. 0.2.0-beta.1 or 0.2.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - stable
      release_summary:
        description: 'Optional extra summary / highlights for UAT release notes'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Portable Windows EXE
    if: github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and channel metadata
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVer = "$env:INPUT_VERSION".Trim().TrimStart('v', 'V')
            $channel = "$env:INPUT_CHANNEL".Trim().ToLowerInvariant()
            if ($channel -eq "beta" -and -not $rawVer.Contains("-")) {
              $rawVer = "$rawVer-beta.${{ github.run_number }}"
            }
            if ($channel -eq "stable" -and $rawVer.Contains("-")) {
              throw "Stable release version cannot contain pre-release suffix: $rawVer"
            }
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $rawVer = "${{ github.ref_name }}".TrimStart('v', 'V')
            $channel = if ($rawVer.Contains("-")) { "beta" } else { "stable" }
          } else {
            $pkgVer = ((Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value).Trim()
            $rawVer = "$pkgVer-beta.${{ github.run_number }}"
            $channel = "beta"
          }
          if ($rawVer -notmatch '^(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version '$rawVer' must follow SemVer (e.g. 0.2.0 or 0.2.0-beta.1)"
          }
          $coreVer = $Matches[1]
          $tagName = "v$rawVer"
          $isPrerelease = if ($channel -eq "beta") { "true" } else { "false" }

          # Sync Cargo.toml [package] version (first match only) to match release tag
          $cargoToml = Get-Content -Path Cargo.toml -Raw
          $cargoToml = ([regex]'(?m)^version\s*=\s*"[^"]+"').Replace($cargoToml, "version = `"$coreVer`"", 1)
          Set-Content -Path Cargo.toml -Value $cargoToml -NoNewline
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$rawVer"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "core_version=$coreVer"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tagName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$isPrerelease"

          Write-Host "Resolved release: tag=$tagName version=$rawVer core=$coreVer channel=$channel prerelease=$isPrerelease"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run full test suite
        id: test
        shell: pwsh
        env:
          IT_TOOLS_DISPLAY_VERSION: ${{ steps.meta.outputs.version }}
          IT_TOOLS_BUILD_NUMBER: ${{ github.run_number }}
          IT_TOOLS_CHANNEL: ${{ steps.meta.outputs.channel }}
          IT_TOOLS_GITHUB_REPO: ${{ github.repository }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $prevErrPref = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $testOut = cargo test 2>&1
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $prevErrPref
          $testOut | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "cargo test failed with exit code $exitCode" }
          $passedTotal = 0
          foreach ($m in [regex]::Matches(($testOut -join "`n"), 'test result: ok\. (\d+) passed; 0 failed')) {
            $passedTotal += [int]$m.Groups[1].Value
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "passed=$passedTotal"
      - name: Build portable release it-tools.exe with PE Version Properties
        id: build
        shell: pwsh
        env:
          IT_TOOLS_DISPLAY_VERSION: ${{ steps.meta.outputs.version }}
          IT_TOOLS_BUILD_NUMBER: ${{ github.run_number }}
          IT_TOOLS_CHANNEL: ${{ steps.meta.outputs.channel }}
          IT_TOOLS_GITHUB_REPO: ${{ github.repository }}
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) {
            throw "cargo build --release failed with exit code $LASTEXITCODE"
          }
          $exe = ".\target\release\it-tools.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $vi = (Get-Item $exe).VersionInfo
          $vi | Select-Object ProductName, ProductVersion, FileVersion, FileDescription, OriginalFilename, Comments | Format-List

          if ($vi.ProductVersion -ne "${{ steps.meta.outputs.version }}") {
            throw "VersionInfo ProductVersion mismatch: $($vi.ProductVersion) != ${{ steps.meta.outputs.version }}"
          }
          if ($vi.OriginalFilename -ne "it-tools.exe") {
            throw "OriginalFilename mismatch: $($vi.OriginalFilename)"
          }
          if ([string]::IsNullOrWhiteSpace($vi.FileVersion)) {
            throw "Missing FileVersion"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath
            $dumpbin = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ($dumpbin) {
            $imports = (& $dumpbin /IMPORTS $exe | Out-String)
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed with exit code $LASTEXITCODE"
            }
            if ($imports -match 'VCRUNTIME140|MSVCP140') {
              throw "Portable binary must not depend on VC++ runtime DLLs"
            }
            Write-Host "PE static CRT check passed via dumpbin.exe"
          } else {
            $raw = [System.IO.File]::ReadAllText($exe, [System.Text.Encoding]::ASCII)
            if ($raw -match 'VCRUNTIME140\.dll|MSVCP140\.dll') {
              throw "Portable binary references dynamic VC++ runtime DLLs"
            }
            Write-Host "PE static CRT check passed via ASCII scan"
          }

          $sizeBytes = (Get-Item $exe).Length
          Add-Content -Path $env:GITHUB_OUTPUT -Value "size_bytes=$sizeBytes"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "file_version=$($vi.FileVersion)"

      - name: Verify release binary read-only smoke checks & package assets
        id: pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = ".\target\release\it-tools.exe"
          Copy-Item $exe dist\it-tools.exe -Force

          foreach ($cmdArgs in @(
            @('--version'),
            @('--help'),
            @('update', '--help'),
            @('config', 'init', '--out', 'dist\it-tools.toml', '--force'),
            @('--config', 'dist\it-tools.toml', 'config', 'validate'),
            @('check', '--json'),
            @('apply', '--dry-run', '--json')
          )) {
            & dist\it-tools.exe @cmdArgs | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Smoke check failed ($($cmdArgs -join ' ')) with exit code $LASTEXITCODE"
            }
          }
          & dist\it-tools.exe --version
          $zipName = "it-tools-v${{ steps.meta.outputs.version }}-windows-x64.zip"
          $zipPath = Join-Path "dist" $zipName
          $zipItems = @("dist\it-tools.exe", "dist\it-tools.toml")
          if (Test-Path "README.md") { $zipItems += "README.md" }
          if (Test-Path "CHANGELOG.md") { $zipItems += "CHANGELOG.md" }
          Compress-Archive -Path $zipItems -DestinationPath $zipPath -Force

          $exeHash = (Get-FileHash -Algorithm SHA256 dist\it-tools.exe).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          @"
          $exeHash  it-tools.exe
          $zipHash  $zipName
          "@ | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii

          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_name=$zipName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe_sha256=$exeHash"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_sha256=$zipHash"

      - name: Generate structured UAT & feature release notes
        shell: pwsh
        env:
          EXTRA_SUMMARY: ${{ inputs.release_summary }}
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $ch = "${{ steps.meta.outputs.channel }}"
          $chLabel = if ($ch -eq "beta") { "BETA / PRA-RILIS (Uji Coba UAT)" } else { "STABIL / RILIS PRODUKSI" }

          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $prevTag = (& git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags 2>$null | Where-Object { $_ -ne $tag } | Select-Object -First 1)
          $commitLines = ""
          $prevLabel = "Awal Proyek"
          if ($prevTag) {
            $logOut = (& git log "$prevTag..HEAD" '--pretty=format:- %s (`%h`)' 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($logOut)) {
              $commitLines = $logOut
              $prevLabel = $prevTag
            }
          }
          if ([string]::IsNullOrWhiteSpace($commitLines)) {
            $commitLines = (& git log -n 20 '--pretty=format:- %s (`%h`)' 2>$null | Out-String).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($commitLines)) {
            $commitLines = "- Build rilis $tag"
          }

          $extraBlock = ""
          if (-not [string]::IsNullOrWhiteSpace($env:EXTRA_SUMMARY)) {
            $extraBlock = "`n### Sorotan Rilis`n`n$($env:EXTRA_SUMMARY.Trim())`n"
          }

          $betaNotice = if ($ch -eq "beta") {
            "> [!WARNING]`n> Ini adalah pra-rilis **Beta** untuk validasi UAT dan staging sebelum promosi ke kanal Stabil.`n"
          } else {
            "> [!NOTE]`n> Ini adalah rilis produksi **Stabil (Latest)** yang telah terverifikasi oleh CI otomatis, pemeriksaan metadata PE, dan pengujian smoke UAT.`n"
          }

          $template = @'
          ## IT-Tools v__VER__ (__CHANNEL_LABEL__)

          __BETA_NOTICE__
          __EXTRA_BLOCK__
          ### Perubahan Sejak __PREV_LABEL__
          __COMMITS__

          ### Executable Portabel & Fitur Utama
          Binary portabel tunggal (`it-tools.exe`, **__SIZE_BYTES__ byte**, static MSVC CRT: tidak membutuhkan `.NET` maupun Visual C++ Redistributable):

          | Kategori | Modul / Fitur | Deskripsi |
          |---|---|---|
          | TUI & UX | `auto_elevate` / `--no-elevate` | Elevasi Administrator UAC otomatis saat membuka `it-tools.exe` (lewati dengan `--no-elevate`) |
          | TUI & UX | `privilege_toggle` (`[x]`) | Pengalihan hak akses realtime antara Administrator dan Pengguna Standar di RAM tanpa restart |
          | TUI & UX | `exec_options` (`[m]`, `[o]`) | Mode Live/Simulasi, Backup Snapshot, Strict Mode, Restart Explorer, dan filter cakupan `HKCU`/`HKLM` |
          | TUI & UX | `hud` & `docs` (`[d]`) | Header Status HUD interaktif dengan chip KPI kepatuhan serta dokumentasi dan glosarium Bahasa Indonesia |
          | UI & UX | `visual_effects` | Menonaktifkan animasi jendela & transparansi antarmuka untuk respon desktop yang gesit |
          | Privasi | `diagnostics` | Membatasi data diagnostik telemetri Windows ke tingkat minimal (Required) & menonaktifkan prompt umpan balik |
          | Privasi | `search` | Menonaktifkan pencarian cloud Bing/MSA, akun kantor/sekolah (AAD), dan sorotan pencarian harian |
          | Input | `typing` | Menonaktifkan koreksi otomatis, sorot salah ketik, prediksi teks, wawasan mengetik, dan input suara |
          | Shell | `taskbar` | Mengatur perataan taskbar, auto-hide, menonaktifkan Widget, lencana, dan kedipan aplikasi |
          | Daya | `power` | Mengaktifkan skema High Performance, waktu tunggu layar/tidur/disk, minimal CPU, dan aksi tombol daya |
          | Keamanan | `screensaver` | Mengaktifkan screensaver pengunci layar 5 menit (`scrnsave.scr`) dengan login ulang |
          | Input | `accessibility` | Mempertahankan perilaku klasik tombol PrintScreen tanpa pemotongan Snipping Tool |
          | Browser | `edge` | Menonaktifkan Edge startup boost, prelaunch, NTP preload, serta mengaktifkan blokir PUA SmartScreen |
          | Pemulihan | `system_restore` | Mengaktifkan System Restore pada drive `C:` dan membatasi ukuran shadow storage (`5GB`) |
          | Akun | `password_policy` | Menegakkan riwayat, panjang minimal, kompleksitas, masa berlaku, dan lockout sandi via `secedit` |
          | Jaringan | `defender_firewall` | Mengaktifkan Microsoft Defender & profil Firewall dengan aturan ICMP echo/router yang dapat dikonfigurasi |
          | Startup | `startup_apps` | Menonaktifkan aplikasi startup non-allowlist pada HKCU/HKLM/Startup folder via `StartupApproved` |
          | Pemeliharaan | `update` (`[v]`) | Pemeriksaan rilis GitHub & pembaruan mandiri terverifikasi SHA-256 (`it-tools update`) |
          | Pemulihan | `backup` / `rollback` (`[b]`) | Snapshot JSON otomatis sebelum setiap apply langsung + pemulihan satu langkah via `rollback` |

          ### Ringkasan Verifikasi Otomatis
          - [x] **Formatting & Linter:** `cargo fmt --check` & `cargo clippy --all-targets -- -D warnings` lulus
          - [x] **Rangkaian Pengujian Otomatis:** `cargo test` lulus (__PASSED_TESTS__ test, 0 gagal)
          - [x] **Pemeriksaan Portabilitas & CRT:** `x86_64-pc-windows-msvc` static CRT terverifikasi (nol impor `VCRUNTIME140.dll` / `MSVCP140.dll`)
          - [x] **Properti Versi PE:** `ProductVersion = __VER__`, `FileVersion = __FILE_VERSION__`, `OriginalFilename = it-tools.exe`
          - [x] **Uji Smoke CLI Non-Mutasi:** `--version`, `config init/validate`, `check --json`, dan `apply --dry-run --json` lulus

          ### Unduhan & Checksum SHA-256
          | Aset Rilis | Kegunaan | SHA-256 |
          |---|---|---|
          | `it-tools.exe` | Binary portabel mandiri (klik ganda / CLI / target self-update) | `__EXE_SHA__` |
          | `__ZIP_NAME__` | Paket portabel (`it-tools.exe` + templat `it-tools.toml` + panduan) | `__ZIP_SHA__` |
          | `SHA256SUMS.txt` | Daftar checksum terverifikasi untuk audit integritas berkas | (Terlampir di aset) |

          ### Panduan Cepat & Pembaruan Mandiri
          ```powershell
          # Mode TUI interaktif (otomatis meminta izin Administrator UAC)
          .\it-tools.exe

          # Mode TUI tanpa elevasi otomatis (mode Pengguna Standar)
          .\it-tools.exe --no-elevate

          # Audit kepatuhan sistem tanpa perubahan (read-only, tanpa perlu admin)
          .\it-tools.exe check

          # Simulasi perubahan aman tanpa memodifikasi Windows
          .\it-tools.exe apply --dry-run

          # Periksa pembaruan atau tingkatkan versi di tempat (tambahkan --beta untuk kanal pra-rilis)
          .\it-tools.exe update --check
          .\it-tools.exe update
          ```
          '@

          $notes = $template.
            Replace('__VER__', $ver).
            Replace('__CHANNEL_LABEL__', $chLabel).
            Replace('__BETA_NOTICE__', $betaNotice).
            Replace('__PREV_LABEL__', $prevLabel).
            Replace('__SIZE_BYTES__', '${{ steps.build.outputs.size_bytes }}').
            Replace('__PASSED_TESTS__', '${{ steps.test.outputs.passed }}').
            Replace('__FILE_VERSION__', '${{ steps.build.outputs.file_version }}').
            Replace('__EXE_SHA__', '${{ steps.pkg.outputs.exe_sha256 }}').
            Replace('__ZIP_NAME__', '${{ steps.pkg.outputs.zip_name }}').
            Replace('__ZIP_SHA__', '${{ steps.pkg.outputs.zip_sha256 }}').
            Replace('__EXTRA_BLOCK__', $extraBlock).
            Replace('__COMMITS__', $commitLines)

          Set-Content -Path dist\RELEASE_NOTES.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: IT-Tools ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.channel == 'beta' && 'Beta' || 'Stabil' }})
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/it-tools.exe
            dist/${{ steps.pkg.outputs.zip_name }}
            dist/SHA256SUMS.txt
